<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos Magnolia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0;
    --surface:#ffffff;
    --surface-2:#f4ece2;
    --ink:#2c211e;
    --muted:#8a776d;
    --border:#e7dbcb;
    --accent:#7d2438;
    --accent-ink:#fff8f4;
    --accent-soft:#f6dde1;
    --sage:#5f6e49;
    --sage-soft:#e7ead9;
    --gold:#a9814e;
    --paid:#3f7a4d;
    --paid-soft:#dcefe0;
    --owed:#b5542a;
    --owed-soft:#fbe4d6;
    --shadow:0 1px 2px rgba(44,33,30,.06), 0 10px 28px -14px rgba(44,33,30,.22);
    --radius:14px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211a17;
      --surface:#2b2320;
      --surface-2:#352b26;
      --ink:#f3e8e0;
      --muted:#b9a89c;
      --border:#453832;
      --accent:#e08a9b;
      --accent-ink:#2a1116;
      --accent-soft:#4a2731;
      --sage:#a2b688;
      --sage-soft:#333f28;
      --gold:#d6b787;
      --paid:#7ecb92;
      --paid-soft:#22392a;
      --owed:#e4966d;
      --owed-soft:#402a1d;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#211a17;
    --surface:#2b2320;
    --surface-2:#352b26;
    --ink:#f3e8e0;
    --muted:#b9a89c;
    --border:#453832;
    --accent:#e08a9b;
    --accent-ink:#2a1116;
    --accent-soft:#4a2731;
    --sage:#a2b688;
    --sage-soft:#333f28;
    --gold:#d6b787;
    --paid:#7ecb92;
    --paid-soft:#22392a;
    --owed:#e4966d;
    --owed-soft:#402a1d;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    padding-inline:16px;
    padding-block:0 32px;
    min-height:100%;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',Georgia,serif;
    text-wrap:balance;
    letter-spacing:.01em;
    margin:0;
  }
  .num{font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- header ---------- */
  header.top{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    background:var(--bg);
    padding-block:14px 10px;
    margin-inline:-16px;
    padding-inline:16px;
    border-bottom:1px solid var(--border);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    max-width:960px;
    margin:0 auto;
  }
  .mark{flex:none;width:34px;height:34px;color:var(--accent);}
  .brand-text{display:flex;flex-direction:column;line-height:1.05;}
  .brand-text .name{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;letter-spacing:.02em;}
  .brand-text .tag{font-size:.72rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}
  .conn-dot{
    margin-left:auto;
    display:flex;align-items:center;gap:6px;
    font-size:.72rem;color:var(--muted);
  }
  .conn-dot .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
  .conn-dot.on .dot{background:var(--paid);}
  .conn-dot.off .dot{background:var(--owed);}

  nav.tabs{
    max-width:960px;
    margin:12px auto 0;
    display:flex;
    gap:6px;
    background:var(--surface-2);
    padding:4px;
    border-radius:999px;
    width:fit-content;
  }
  nav.tabs button{
    border:none;background:transparent;color:var(--muted);
    padding:8px 18px;border-radius:999px;font-size:.88rem;font-weight:600;
    cursor:pointer;transition:background .15s,color .15s;
  }
  nav.tabs button.active{background:var(--accent);color:var(--accent-ink);}

  main{max-width:960px;margin:0 auto;}

  /* ---------- banner ---------- */
  .banner{
    margin-top:14px;padding:12px 14px;border-radius:var(--radius);
    background:var(--owed-soft);color:var(--owed);font-size:.85rem;
    display:flex;gap:8px;align-items:flex-start;
  }
  .banner a, .banner code{color:inherit;text-decoration:underline;}

  /* ---------- stats ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    margin-top:18px;
  }
  @media (max-width:640px){ .stats{grid-template-columns:repeat(2,1fr);} }
  .stat{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);
  }
  .stat .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .stat .value{font-family:'Fraunces',serif;font-size:1.5rem;margin-top:4px;font-weight:500;}
  .stat.accent .value{color:var(--accent);}
  .stat.owed .value{color:var(--owed);}
  .stat.paid .value{color:var(--paid);}

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    margin-top:20px;
  }
  .toolbar select, .toolbar input[type="search"]{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:8px 10px;font-size:.85rem;
  }
  .toolbar input[type="search"]{flex:1;min-width:140px;}
  .spacer{flex:1;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    padding:9px 16px;border-radius:10px;font-size:.85rem;font-weight:600;
    cursor:pointer;transition:transform .1s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px;}
  .btn.danger{color:var(--owed);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- lists ---------- */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .empty{
    text-align:center;color:var(--muted);padding:40px 16px;
    border:1px dashed var(--border);border-radius:var(--radius);margin-top:14px;font-size:.9rem;
  }

  /* order card */
  .order-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:10px;
  }
  .order-top{display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .order-top-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .order-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2);}
  .order-thumb-empty{width:56px;height:56px;border-radius:10px;flex:none;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .order-top .prod{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .order-top .cost{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--accent);white-space:nowrap;}
  .pills{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{
    font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;
  }
  .pill.pendiente{background:var(--surface-2);color:var(--muted);}
  .pill.preparacion{background:var(--sage-soft);color:var(--sage);}
  .pill.entregado{background:var(--paid-soft);color:var(--paid);}
  .pill.pagado{background:var(--paid-soft);color:var(--paid);}
  .pill.debe{background:var(--owed-soft);color:var(--owed);}

  .order-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:.85rem;
  }
  @media (max-width:520px){ .order-grid{grid-template-columns:1fr;} }
  .order-grid .f-label{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;}
  .order-grid .f-value{margin-top:1px;}

  .frase{
    font-family:'Fraunces',serif;font-style:italic;color:var(--ink);
    background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.9rem;
    border-left:3px solid var(--accent);
  }
  .order-actions{display:flex;gap:6px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:10px;}

  /* product card */
  .products-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px;
  }
  .product-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  }
  .product-card .pimg-wrap{width:100%;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;}
  .product-card .pimg-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-card .pimg-wrap.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .product-card .pbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .product-card .pname{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;}
  .product-card .pdesc{font-size:.82rem;color:var(--muted);flex:1;line-height:1.4;}
  .product-card .pprice{font-family:'Fraunces',serif;color:var(--accent);font-size:1.15rem;}
  .product-card .pactions{display:flex;gap:6px;justify-content:flex-end;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(30,20,17,.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    padding:0;
  }
  @media (min-width:640px){ .overlay{align-items:center;padding:20px;} }
  .modal{
    background:var(--surface);color:var(--ink);width:100%;max-width:520px;
    border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:var(--shadow);
  }
  @media (min-width:640px){ .modal{border-radius:18px;} }
  .modal h2{font-size:1.25rem;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .field input, .field select, .field textarea{
    border:1px solid var(--border);background:var(--bg);color:var(--ink);
    border-radius:10px;padding:10px 11px;font-size:.92rem;font-family:inherit;width:100%;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:420px){ .row2{grid-template-columns:1fr;} }
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:-1px;background:var(--surface);padding-top:6px;}
  .modal.wide{max-width:640px;}

  .ruta-check{display:flex;align-items:flex-start;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:.88rem;cursor:pointer;}
  .ruta-check input{margin-top:3px;flex:none;}
  .ruta-check.disabled{opacity:.55;cursor:default;}
  .ruta-check em{font-style:normal;color:var(--muted);}
  .ruta-lista{display:flex;flex-direction:column;gap:0;margin:12px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .ruta-parada{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--border);font-size:.88rem;}
  .ruta-parada:last-child{border-bottom:none;}
  .ruta-parada.origen{background:var(--surface-2);}
  .ruta-parada .num{
    flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;
  }
  .ruta-parada.origen .num{background:var(--sage);font-size:.9rem;}
  .muted{color:var(--muted);font-size:.85rem;}

  .toast-wrap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.85rem;box-shadow:var(--shadow);}

  .img-field{display:flex;align-items:center;gap:12px;}
  .img-preview{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none;}
  .img-preview-empty{width:72px;height:72px;border-radius:10px;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .img-field .btn{padding:8px 12px;font-size:.8rem;}
  .flower-icon{width:22px;height:22px;}

  [hidden]{display:none!important;}
</style>
</head>
<body>

<header class="top">
  <div class="brand-row">
    <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 6c-3 5-9 8-9 15a9 9 0 0 0 18 0c0-7-6-10-9-15Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M24 21v19M24 40c0-6-5-8-9-8M24 34c0-5 5-7 9-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-text">
      <span class="name">Casa Magnolia</span>
      <span class="tag">Amor &amp; Amistad</span>
    </div>
    <div class="conn-dot" id="connIndicator"><span class="dot"></span><span id="connLabel">Conectando…</span></div>
  </div>
  <nav class="tabs">
    <button id="tabPedidosBtn" class="active">Pedidos</button>
    <button id="tabProductosBtn">Productos</button>
  </nav>
</header>

<main>
  <div id="offlineBanner" class="banner" hidden></div>

  <!-- ===================== PEDIDOS VIEW ===================== -->
  <section id="viewPedidos">
    <div class="stats">
      <div class="stat">
        <div class="label">Pedidos</div>
        <div class="value num" id="statTotal">0</div>
      </div>
      <div class="stat owed">
        <div class="label">Por cobrar</div>
        <div class="value num" id="statPorCobrar">$0</div>
      </div>
      <div class="stat paid">
        <div class="label">Cobrado</div>
        <div class="value num" id="statCobrado">$0</div>
      </div>
      <div class="stat accent">
        <div class="label">Entregas hoy</div>
        <div class="value num" id="statHoy">0</div>
      </div>
    </div>

    <div class="toolbar">
      <input type="search" id="searchPedidos" placeholder="Buscar por remitente o destinatario…">
      <select id="filterEstadoPedido">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="preparacion">En preparación</option>
        <option value="entregado">Entregado</option>
      </select>
      <select id="filterEstadoPago">
        <option value="">Pago y debe</option>
        <option value="pagado">Pagado</option>
        <option value="debe">Debe</option>
      </select>
      <span class="spacer"></span>
      <button class="btn ghost" id="openRuta">🚚 Ruta óptima</button>
      <button class="btn primary" id="openNewPedido">+ Nuevo pedido</button>
    </div>

    <div class="list" id="pedidosList"></div>
    <div class="empty" id="pedidosEmpty" hidden>Aún no hay pedidos registrados.</div>
  </section>

  <!-- ===================== PRODUCTOS VIEW ===================== -->
  <section id="viewProductos" hidden>
    <div class="toolbar">
      <span class="spacer"></span>
      <button class="btn primary" id="openNewProducto">+ Nuevo producto</button>
    </div>
    <div class="products-grid" id="productsGrid"></div>
    <div class="empty" id="productsEmpty" hidden>Aún no hay productos en el catálogo.</div>
  </section>
</main>

<!-- ===================== MODAL: PEDIDO ===================== -->
<div class="overlay" id="pedidoOverlay" hidden>
  <div class="modal">
    <h2 id="pedidoModalTitle">Nuevo pedido</h2>
    <form id="pedidoForm">
      <input type="hidden" id="pedidoId">
      <div class="field">
        <label for="pedidoProducto">Arreglo / producto</label>
        <select id="pedidoProducto"></select>
      </div>
      <div class="field" id="customNameField" hidden>
        <label for="pedidoProductoNombre">Nombre del arreglo personalizado</label>
        <input type="text" id="pedidoProductoNombre" placeholder="Ej. Ramo especial de cumpleaños">
      </div>
      <div class="row2">
        <div class="field">
          <label for="pedidoRemitente">Quien envía</label>
          <input type="text" id="pedidoRemitente" required placeholder="Nombre de quien hace el pedido">
        </div>
        <div class="field">
          <label for="pedidoDestinatario">Quien recibe</label>
          <input type="text" id="pedidoDestinatario" required placeholder="Nombre de quien recibe">
        </div>
      </div>
      <div class="field">
        <label for="pedidoDireccion">Dirección de entrega</label>
        <textarea id="pedidoDireccion" required placeholder="Dirección, barrio, indicaciones…"></textarea>
      </div>
      <div class="field">
        <label for="pedidoFrase">Frase del arreglo</label>
        <textarea id="pedidoFrase" placeholder="Mensaje que llevará la tarjeta…"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label for="pedidoCosto">Costo del arreglo (COP)</label>
          <input type="number" id="pedidoCosto" min="0" step="1000" required>
        </div>
        <div class="field">
          <label for="pedidoFecha">Fecha de entrega</label>
          <input type="date" id="pedidoFecha">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="pedidoEstadoPedido">Estado del pedido</label>
          <select id="pedidoEstadoPedido">
            <option value="pendiente">Pendiente</option>
            <option value="preparacion">En preparación</option>
            <option value="entregado">Entregado</option>
          </select>
        </div>
        <div class="field">
          <label for="pedidoEstadoPago">Estado de pago</label>
          <select id="pedidoEstadoPago">
            <option value="debe">Debe</option>
            <option value="pagado">Pagado</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancelPedido">Cancelar</button>
        <button type="submit" class="btn primary" id="savePedidoBtn">Guardar pedido</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== MODAL: PRODUCTO ===================== -->
<div class="overlay" id="productoOverlay" hidden>
  <div class="modal">
    <h2 id="productoModalTitle">Nuevo producto</h2>
    <form id="productoForm">
      <input type="hidden" id="productoId">
      <input type="hidden" id="productoImagenPath">
      <input type="hidden" id="productoImagenUrl">
      <div class="field">
        <label>Foto del arreglo</label>
        <div class="img-field">
          <img id="productoImagenPreview" class="img-preview" hidden>
          <div id="productoImagenPreviewEmpty" class="img-preview-empty">
            <svg class="flower-icon" viewBox="0 0 48 48" fill="none"><path d="M24 6c-3 5-9 8-9 15a9 9 0 0 0 18 0c0-7-6-10-9-15Z" stroke="currentColor" stroke-width="2.2"/><path d="M24 21v19M24 40c0-6-5-8-9-8M24 34c0-5 5-7 9-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </div>
          <input type="file" id="productoImagenInput" accept="image/*" style="display:none">
          <button type="button" class="btn ghost" id="productoImagenBtn">Subir foto</button>
        </div>
      </div>
      <div class="field">
        <label for="productoNombre">Nombre del arreglo</label>
        <input type="text" id="productoNombre" required placeholder='Ej. "Éloise"'>
      </div>
      <div class="field">
        <label for="productoDescripcion">Descripción</label>
        <textarea id="productoDescripcion" placeholder="Descripción del arreglo…"></textarea>
      </div>
      <div class="field">
        <label for="productoPrecio">Valor (COP)</label>
        <input type="number" id="productoPrecio" min="0" step="1000" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancelProducto">Cancelar</button>
        <button type="submit" class="btn primary" id="saveProductoBtn">Guardar producto</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== MODAL: RUTA ÓPTIMA ===================== -->
<div class="overlay" id="rutaOverlay" hidden>
  <div class="modal wide">
    <h2>Ruta óptima de entregas</h2>
    <div class="field">
      <label for="rutaFecha">Fecha de entrega</label>
      <input type="date" id="rutaFecha">
    </div>
    <div id="rutaSeleccion"></div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="cancelRuta">Cerrar</button>

  /* ---------------- ruta óptima de entregas ---------------- */
  var ORIGEN_TEXTO = 'Cra 13 # 59-20, Castellana, Montería, Córdoba, Colombia';
  var geocodeCache = {};

  function extraeCoordsDeLink(direccion){
    var m = /[-?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/.exec(direccion || '');
    if(m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };
    return null;
  }
  function esRecogida(direccion){
    var d = (direccion || '').toLowerCase();
    return d.indexOf('recoge') !== -1 || d.indexOf('recoger') !== -1;
  }
  function pausa(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function geocodeDireccion(direccion){
    var coords = extraeCoordsDeLink(direccion);
    if(coords) return coords;
    if(Object.prototype.hasOwnProperty.call(geocodeCache, direccion)) return geocodeCache[direccion];
    var q = direccion;
    if(!/monter[ií]a/i.test(q)) q += ', Montería, Córdoba, Colombia';
    var resultado = null;
    try{
      var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=co&q=' + encodeURIComponent(q);
      var res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      var data = await res.json();
      if(data && data[0]){
        resultado = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
      }
    } catch(e){ resultado = null; }
    geocodeCache[direccion] = resultado;
    return resultado;
  }

  function haversine(a, b){
    var R = 6371;
    var dLat = (b.lat - a.lat) * Math.PI / 180;
    var dLon = (b.lon - a.lon) * Math.PI / 180;
    var lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  function ordenarPorVecinoMasCercano(origen, paradas){
    var restantes = paradas.slice();
    var actual = origen;
    var orden = [];
    while(restantes.length){
      var idxMasCercano = 0, distMin = Infinity;
      for(var i = 0; i < restantes.length; i++){
        var d = haversine(actual, restantes[i].coords);
        if(d < distMin){ distMin = d; idxMasCercano = i; }
      }
      var siguiente = restantes.splice(idxMasCercano, 1)[0];
      orden.push(siguiente);
      actual = siguiente.coords;
    }
    return orden;
  }

  document.getElementById('calcularRutaBtn').addEventListener('click', async function(){
    var checks = Array.prototype.slice.call(document.querySelectorAll('#rutaSeleccion input[type=checkbox]:checked'));
    var idsSeleccionados = checks.map(function(c){ return c.dataset.id; });
    var seleccion = state.pedidos.filter(function(p){ return idsSeleccionados.indexOf(p.id) !== -1; });
    var resDiv = document.getElementById('rutaResultado');
    if(!seleccion.length){
      resDiv.innerHTML = '<p class="muted">Selecciona al menos una entrega.</p>';
      return;
    }
    var btn = document.getElementById('calcularRutaBtn');
    btn.disabled = true;
    resDiv.innerHTML = '<p class="muted">Ubicando direcciones… esto puede tardar unos segundos.</p>';

    var origen = await geocodeDireccion(ORIGEN_TEXTO);
    var paradas = [];
    var sinUbicar = [];
    for(var i = 0; i < seleccion.length; i++){
      var p = seleccion[i];
      var coords = await geocodeDireccion(p.direccion);
      if(coords){
        paradas.push({ pedido: p, coords: coords });
      } else {
        sinUbicar.push(p);
      }
      await pausa(250);
    }

    btn.disabled = false;

    if(!origen){
      resDiv.innerHTML = '<p class="muted">No se pudo ubicar la dirección de tu local. Intenta de nuevo en unos minutos.</p>';
      return;
    }
    if(!paradas.length){
      resDiv.innerHTML = '<p class="muted">No se pudo ubicar ninguna de las direcciones seleccionadas.</p>';
      return;
    }

    var ordenadas = ordenarPorVecinoMasCercano(origen, paradas);

    var html = '<div class="ruta-lista">';
    html += '<div class="ruta-parada origen"><span class="num">🏠</span><div><strong>Casa Magnolia</strong><br>' + esc(ORIGEN_TEXTO) + '</div></div>';
    ordenadas.forEach(function(item, idx){
      var p = item.pedido;
      html += '<div class="ruta-parada"><span class="num">' + (idx + 1) + '</span><div><strong>' + esc(p.destinatario || '') + '</strong><br>' +
        esc(p.direccion || '') + '<br><span class="muted">' + esc(p.productoNombre || '') + '</span></div></div>';
    });
    html += '</div>';

    if(sinUbicar.length){
      html += '<p class="muted">No se pudieron ubicar estas direcciones (revísalas manualmente): ' +
        sinUbicar.map(function(p){ return esc((p.destinatario || '') + ' — ' + (p.direccion || '')); }).join('; ') + '</p>';
    }

    function valorParaMaps(direccion, coords){
      var link = extraeCoordsDeLink(direccion);
      if(link) return link.lat + ',' + link.lon;
      var texto = direccion || (coords.lat + ',' + coords.lon);
      if(!/monter[ií]a/i.test(texto)) texto += ', Montería, Córdoba, Colombia';
      return texto;
    }

    var destinoFinal = ordenadas[ordenadas.length - 1];
    var mapsUrl = 'https://www.google.com/maps/dir/?api=1' +
      '&origin=' + encodeURIComponent(ORIGEN_TEXTO) +
      '&destination=' + encodeURIComponent(valorParaMaps(destinoFinal.pedido.direccion, destinoFinal.coords)) +
      (ordenadas.length > 1 ? '&waypoints=' + encodeURIComponent(ordenadas.slice(0, -1).map(function(o){ return valorParaMaps(o.pedido.direccion, o.coords); }).join('|')) : '') +
      '&travelmode=driving';

    html += '<div class="modal-actions"><a class="btn primary" href="' + mapsUrl + '" target="_blank" rel="noopener">Abrir ruta en Google Maps</a></div>';

    resDiv.innerHTML = html;
  });

  /* ---------------- delegated actions ---------------- */
  document.getElementById('pedidosList').addEventListener('click', async function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn) return;
    var id = btn.dataset.id;
    var pedido = state.pedidos.find(function(p){ return p.id === id; });
    if(!pedido) return;

    if(btn.dataset.action === 'edit-pedido'){
      openPedidoModal(pedido);
    } else if(btn.dataset.action === 'delete-pedido'){
      if(!state.dbReady) { toast('No hay conexión a la base de datos.'); return; }
      if(!confirm('¿Eliminar este pedido de '+pedido.destinatario+'?')) return;
      try{ await deleteDoc(doc(state.dbInstance, 'pedidos', id)); toast('Pedido eliminado.'); }
      catch(err){ toast('No se pudo eliminar el pedido.'); }
    } else if(btn.dataset.action === 'toggle-pago'){
      if(!state.dbReady) { toast('No hay conexión a la base de datos.'); return; }
      var next = pedido.estadoPago === 'pagado' ? 'debe' : 'pagado';
      try{ await updateDoc(doc(state.dbInstance, 'pedidos', id), { estadoPago: next }); }
      catch(err){ toast('No se pudo actualizar el estado de pago.'); }
    }
  });

  document.getElementById('productsGrid').addEventListener('click', async function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn) return;
    var id = btn.dataset.id;
    var producto = state.products.find(function(p){ return p.id === id; });
    if(!producto) return;

    if(btn.dataset.action === 'edit-producto'){
      openProductoModal(producto);
    } else if(btn.dataset.action === 'delete-producto'){
      if(!state.dbReady) { toast('No hay conexión a la base de datos.'); return; }
      if(!confirm('¿Eliminar "'+producto.nombre+'" del catálogo?')) return;
      try{ await deleteDoc(doc(state.dbInstance, 'products', id)); toast('Producto eliminado.'); }
      catch(err){ toast('No se pudo eliminar el producto.'); }
    }
  });

  /* ---------------- firebase wiring ---------------- */
  function setConn(status, message){
    var ind = document.getElementById('connIndicator');
    var label = document.getElementById('connLabel');
    var banner = document.getElementById('offlineBanner');
    ind.classList.remove('on','off');
    if(status === 'on'){
      ind.classList.add('on'); label.textContent = 'Sincronizado'; banner.hidden = true;
    } else if(status === 'off'){
      ind.classList.add('off'); label.textContent = 'Sin conexión'; banner.hidden = false;
      banner.textContent = message || 'No se pudo conectar a la base de datos.';
    } else {
      label.textContent = 'Conectando…';
    }
  }

  async function seedProductsIfEmpty(){
    try{
      var snap = await getDocs(collection(state.dbInstance, 'products'));
      if(!snap.empty) return;
      for(var i=0;i<SEED_PRODUCTS.length;i++){
        var p = SEED_PRODUCTS[i];
        await setDoc(doc(state.dbInstance, 'products', p.id), {
          nombre: p.nombre,
          descripcion: p.descripcion,
          precio: p.precio,
          imagenUrl: p.imagenUrl,
          imagenPath: null
        });
      }
    } catch(err){
      // Si falla (p.ej. reglas de seguridad), simplemente no se precarga el catálogo;
      // Cindy puede agregar los productos manualmente desde la pestaña "Productos".
    }
  }

  function init(){
    if(!FIREBASE_CONFIGURADO){
      setConn('off', 'Falta configurar Firebase: abre el archivo HTML y pega tu firebaseConfig (ver el comentario en el código, justo antes del <script type="module">).');
      state.dbReady = false;
      renderPedidos();
      renderProducts();
      return;
    }

    try{
      var app = initializeApp(firebaseConfig);
      state.dbInstance = getFirestore(app);
      state.storage = getStorage(app);
    } catch(err){
      setConn('off', 'No se pudo inicializar Firebase. Revisa que firebaseConfig sea correcto.');
      renderPedidos();
      renderProducts();
      return;
    }

    state.dbReady = true;
    setConn('on');

    seedProductsIfEmpty();

    onSnapshot(collection(state.dbInstance, 'products'), function(snap){
      state.products = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      renderProducts();
      renderPedidos();
    }, function(err){ setConn('off', 'Se perdió la conexión con Firestore.'); state.dbReady = false; });

    onSnapshot(collection(state.dbInstance, 'pedidos'), function(snap){
      state.pedidos = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      renderPedidos();
    }, function(err){ setConn('off', 'Se perdió la conexión con Firestore.'); state.dbReady = false; });
  }

  renderPedidos();
  renderProducts();
  init();
  })();
</script>
</body>
</html>
